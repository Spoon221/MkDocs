<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280">
  <rect width="720" height="280" fill="#fdfdfd" rx="6"/>

  <text x="360" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#222">CI/CD Pipeline</text>

  <rect x="30" y="55" width="120" height="50" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="90" y="77" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#222">git push</text>
  <text x="90" y="93" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#666">main branch</text>

  <line x1="150" y1="80" x2="190" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <rect x="195" y="55" width="120" height="50" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="255" y="77" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#bf360c">lint</text>
  <text x="255" y="93" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#666">mkdocs build --strict</text>

  <line x1="315" y1="80" x2="355" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <rect x="360" y="55" width="120" height="50" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="420" y="77" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#0d47a1">build</text>
  <text x="420" y="93" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#666">pip cache + artifact</text>

  <line x1="420" y1="105" x2="420" y2="135" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <rect x="260" y="140" width="130" height="50" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="325" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#1b5e20">deploy-pages</text>
  <text x="325" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#666">GitHub Pages</text>

  <rect x="450" y="140" width="130" height="50" rx="4" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5"/>
  <text x="515" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#006064">deploy-helios</text>
  <text x="515" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#666">rsync SSH:2222</text>

  <line x1="420" y1="135" x2="325" y2="140" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="420" y1="135" x2="515" y2="140" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>

  <line x1="325" y1="190" x2="325" y2="220" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="515" y1="190" x2="515" y2="220" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <rect x="230" y="225" width="190" height="35" rx="4" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="325" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">spoon221.github.io/SSG/</text>

  <rect x="420" y="225" width="190" height="35" rx="4" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="515" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">se.ifmo.ru/~s506807/ssg/</text>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>
</svg>
